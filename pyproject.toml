[project]
name = "temu-delisting"
version = "0.1.0"
description = "Temu 卖家中心违规商品自动化下架工具"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "PySide6>=6.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[project.scripts]
temu-delisting = "temu_delisting.cli:main"
temu-delisting-gui = "temu_delisting_gui.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
